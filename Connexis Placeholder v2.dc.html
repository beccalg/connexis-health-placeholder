<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<title>Connexis Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  a { color: #0f7b73; text-decoration: none; }
  a:hover { color: #17365c; text-decoration: underline; }
</style>
</helmet>
<div style="min-height: 100vh; display: grid; place-items: center; background: #fcfcfb; font-family: Jost, Helvetica, sans-serif; padding: 48px 24px; box-sizing: border-box;">
  <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 40px; text-align: center;">
    <img src="assets/logo.png" alt="" style="width: 100%; max-width: 620px; height: auto; display: block;" />
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="width: 36px; height: 1px; background: #17365c; display: block;"></span>
        <span style="font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #17365c; font-weight: 500;">More information coming soon</span>
        <span style="width: 36px; height: 1px; background: #0f7b73; display: block;"></span>
      </div>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #4a5560; font-weight: 300; max-width: 460px; text-wrap: pretty;">{{ blurb }}</p>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;blurb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Our new site is on the way. In the meantime, reach out and we will be glad to connect.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      blurb: this.props.blurb ?? "Our new site is on the way. Please check back soon."
    };
  }
}
</script>
</body>
</html>
